  <script>
  const interactiveBlocks = document.querySelectorAll('.interactive-path');

  interactiveBlocks.forEach((block) => {
    const textPath = block.querySelector('.moving-text-path');
    if (!textPath) return;

    const originalText = textPath.textContent.trim();
    const separator = ' ✦ ';
    const repeatCount = 8;
    const segmentText = originalText + separator;

    textPath.textContent = segmentText.repeat(repeatCount);

    let offset = 0;
    let speed = 0;
    let targetSpeed = 0;

    requestAnimationFrame(() => {
      const fullLength = textPath.getComputedTextLength();
      const segmentLength = fullLength / repeatCount;

      // Position text so the topmost point of the path is at the start
      // Top is at arc-length 130.9 units (39.1% along the scaled path)
      // Since we apply -offset, we set offset = segmentLength - 130.9
      // so -offset lands at the top position
      offset = segmentLength - 130.9;

      function animate() {
        speed += (targetSpeed - speed) * 0.08;
        offset += speed;

        if (offset >= segmentLength) offset -= segmentLength;
        if (offset < 0) offset += segmentLength;

        textPath.setAttribute('startOffset', -offset);
        requestAnimationFrame(animate);
      }

      block.addEventListener('mouseenter', () => { targetSpeed = 0.12; });
      block.addEventListener('mouseleave', () => { targetSpeed = 0; });

      animate();
    });
  });

  // ===== LETTER STAMP — HEADER & FOOTER =====
  const stampLetters = ['S','I','N','D','H','A','J','R','K'];

  function makeCursorLetter(text) {
    const c = document.createElement('canvas');
    c.width = 80; c.height = 80;
    const ctx = c.getContext('2d');
    ctx.font = '100 72px ajrak, AgencyFB, Impact, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(text, 40, 72);
    return `url("${c.toDataURL()}") 40 72, auto`;
  }

  function setupStampSection(section) {
    let nextLetter = stampLetters[Math.floor(Math.random() * stampLetters.length)];
    section.style.cursor = makeCursorLetter(nextLetter);

    section.addEventListener('click', (e) => {
      const letter = nextLetter;
      const el = document.createElement('span');
      el.className = 'stamp-letter';
      el.textContent = letter;
      el.style.left = e.clientX - section.getBoundingClientRect().left + 'px';
      el.style.top  = e.clientY - section.getBoundingClientRect().top  + 'px';
      section.appendChild(el);
      requestAnimationFrame(() => el.classList.add('stamp-active'));
      nextLetter = stampLetters[Math.floor(Math.random() * stampLetters.length)];
      section.style.cursor = makeCursorLetter(nextLetter);
    });
  }

  // Wait for ajrak font to load before generating first cursor
  document.fonts.load('100 72px ajrak').then(() => {
    setupStampSection(document.querySelector('.main-header'));
    setupStampSection(document.querySelector('.closing-footer'));
  });




  // ===== BEAT ON CLICK =====
  document.querySelectorAll('.image-text-wrap').forEach(block => {
    block.addEventListener('click', () => {
      block.classList.remove('breathing');
      void block.offsetWidth; // reflow to restart
      block.classList.add('breathing');
      block.addEventListener('animationend', () => block.classList.remove('breathing'), { once: true });
    });
  });



  // ===== ROTATING CUSTOM CURSOR — MIDDLE SECTION =====
  const cursorEl = document.createElement('img');
  cursorEl.src = 'images/cursor.png';
  cursorEl.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;display:none;transform-origin:center center;';
  document.body.appendChild(cursorEl);

  let cursorAngle = 0;
  let cursorX = 0, cursorY = 0;
  let inMiddle = false;
  let cursorSize = 32;

  cursorEl.onload = () => {
    cursorSize = cursorEl.naturalWidth || 32;
  };

  document.querySelectorAll('.blocks-row').forEach(row => {
    row.addEventListener('mouseenter', () => {
      inMiddle = true;
      cursorEl.style.display = 'block';
    });
    row.addEventListener('mouseleave', () => {
      inMiddle = false;
      cursorEl.style.display = 'none';
    });
  });

  document.addEventListener('mousemove', (e) => {
    cursorX = e.clientX;
    cursorY = e.clientY;
  });

  function animateCursor() {
    if (inMiddle) {
      cursorAngle -= 0.4; // anti-clockwise
      const half = cursorEl.offsetWidth / 2 || 16;
      cursorEl.style.left = (cursorX - half) + 'px';
      cursorEl.style.top  = (cursorY - half) + 'px';
      cursorEl.style.transform = `rotate(${cursorAngle}deg)`;
    }
    requestAnimationFrame(animateCursor);
  }
  requestAnimationFrame(animateCursor);

</script>
